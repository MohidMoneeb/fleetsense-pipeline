<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box   { rx:10; stroke-width:1.5; }
      .lbl   { font-size:13px; fill:#0f172a; font-weight:600; }
      .sub   { font-size:11px; fill:#475569; }
      .edge  { stroke:#475569; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .edged { stroke:#94a3b8; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#arrow); }
      .band  { font-size:12px; fill:#64748b; font-weight:700; letter-spacing:1px; }
      .title { font-size:20px; fill:#0f172a; font-weight:700; }
    </style>
  </defs>

  <text x="40" y="40" class="title">FleetSense — Predictive-Maintenance Inference Flow</text>

  <!-- ===== Real-time API path ===== -->
  <text x="40" y="80" class="band">REAL-TIME API</text>
  <rect class="box" x="40"  y="92"  width="170" height="66" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="125" y="118" text-anchor="middle" class="lbl">Client</text>
  <text x="125" y="136" text-anchor="middle" class="sub">POST sensor window</text>
  <text x="125" y="150" text-anchor="middle" class="sub">25 cycles × 21 sensors</text>

  <rect class="box" x="250" y="92" width="150" height="66" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="325" y="122" text-anchor="middle" class="lbl">API Gateway</text>
  <text x="325" y="140" text-anchor="middle" class="sub">HTTP · /predict</text>

  <rect class="box" x="440" y="92" width="200" height="66" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="540" y="116" text-anchor="middle" class="lbl">Lambda (container)</text>
  <text x="540" y="133" text-anchor="middle" class="sub">fleetsense-rul-predict</text>
  <text x="540" y="148" text-anchor="middle" class="sub">XGBoost · RUL regression</text>

  <rect class="box" x="680" y="92" width="200" height="66" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="780" y="116" text-anchor="middle" class="lbl">Response</text>
  <text x="780" y="133" text-anchor="middle" class="sub">RUL (cycles)</text>
  <text x="780" y="148" text-anchor="middle" class="sub">band: green / yellow / red</text>

  <path class="edge" d="M210,125 L248,125"/>
  <path class="edge" d="M400,125 L438,125"/>
  <path class="edge" d="M640,125 L678,125"/>

  <!-- ===== Scheduled pipeline ===== -->
  <text x="40" y="250" class="band">SCHEDULED SCORING (every 5 min)</text>
  <rect class="box" x="40"  y="262" width="150" height="64" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="115" y="290" text-anchor="middle" class="lbl">EventBridge</text>
  <text x="115" y="308" text-anchor="middle" class="sub">rate(5 minutes)</text>

  <rect class="box" x="230" y="262" width="180" height="64" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="320" y="290" text-anchor="middle" class="lbl">Lambda</text>
  <text x="320" y="308" text-anchor="middle" class="sub">fleetsense-health-poller</text>

  <rect class="box" x="230" y="392" width="180" height="60" fill="#f1f5f9" stroke="#64748b"/>
  <text x="320" y="418" text-anchor="middle" class="lbl">DynamoDB</text>
  <text x="320" y="435" text-anchor="middle" class="sub">VehicleTelemetry</text>

  <rect class="box" x="470" y="262" width="180" height="64" fill="#f1f5f9" stroke="#64748b"/>
  <text x="560" y="290" text-anchor="middle" class="lbl">DynamoDB</text>
  <text x="560" y="308" text-anchor="middle" class="sub">VehicleHealth</text>

  <rect class="box" x="710" y="262" width="180" height="64" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="800" y="284" text-anchor="middle" class="lbl">Streamlit Dashboard</text>
  <text x="800" y="302" text-anchor="middle" class="sub">Fleet Health panel</text>
  <text x="800" y="316" text-anchor="middle" class="sub">🟢 🟡 🔴 per vehicle</text>

  <path class="edge" d="M190,294 L228,294"/>
  <path class="edge" d="M320,392 L320,328"/>
  <text x="332" y="360" class="sub">read window</text>
  <path class="edge" d="M410,294 L468,294"/>
  <text x="415" y="286" class="sub">write score</text>
  <path class="edge" d="M650,294 L708,294"/>
  <text x="655" y="286" class="sub">read</text>

  <!-- poller invokes the inference Lambda -->
  <path class="edged" d="M410,270 C450,230 500,200 540,160"/>
  <text x="452" y="212" class="sub">invoke</text>

  <!-- ===== Monitoring ===== -->
  <text x="40" y="520" class="band">MONITORING</text>
  <rect class="box" x="440" y="532" width="200" height="60" fill="#fef2f2" stroke="#dc2626"/>
  <text x="540" y="558" text-anchor="middle" class="lbl">CloudWatch alarms</text>
  <text x="540" y="575" text-anchor="middle" class="sub">errors · p95 latency</text>

  <rect class="box" x="680" y="532" width="200" height="60" fill="#fef2f2" stroke="#dc2626"/>
  <text x="780" y="558" text-anchor="middle" class="lbl">SNS</text>
  <text x="780" y="575" text-anchor="middle" class="sub">fleetsense-alerts → email</text>

  <path class="edge" d="M540,158 L540,530"/>
  <text x="548" y="360" class="sub">metrics</text>
  <path class="edge" d="M640,562 L678,562"/>

  <text x="40" y="628" class="sub">Measured latency (50-req load test): cold start ~1.2 s · warm ~1.0–1.1 s.  Model: XGBoost, test RMSE 16.55 on C-MAPSS FD001.</text>
</svg>
